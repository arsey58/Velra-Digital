name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Build
        run: npm run build

      - name: Zip dist
        run: zip -r dist.zip dist/

      - name: Deploy via SSH
        env:
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo apt-get install -y sshpass
          sshpass -p "$SSH_PASS" scp -P 65002 -o StrictHostKeyChecking=no dist.zip u212110799@46.202.186.67:~/
          sshpass -p "$SSH_PASS" ssh -p 65002 -o StrictHostKeyChecking=no u212110799@46.202.186.67 "rm -rf ~/public_html/* && unzip -o ~/dist.zip -d ~/ && cp -r ~/dist/* ~/public_html/ && rm -rf ~/dist ~/dist.zip"